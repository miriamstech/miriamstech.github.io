    <label for="theme-toggle" class="fixed bottom-8 right-8 z-10 inline-flex items-center cursor-pointer">
        <input type="checkbox" id="theme-toggle" class="sr-only peer">
        <div class="relative w-11 h-6 
                    bg-gray-200 
                    dark:bg-gray-600 
                    peer-checked:bg-accent
                    rounded-full 
                    after:content-[''] after:absolute after:top-[2px] after:left-[2px] 
                    after:bg-white after:border-gray-300 after:border after:rounded-full 
                    after:h-5 after:w-5 
                    after:transition-all peer-checked:after:translate-x-full">
        </div>
    </label>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        function applyInitialTheme() {
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme === 'dark') {
                htmlElement.classList.add('dark');
                themeToggle.checked = true;
            } else {
                htmlElement.classList.remove('dark');
                themeToggle.checked = false;
            }
        }

        themeToggle.addEventListener('change', () => {
            if (themeToggle.checked) {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        });

        applyInitialTheme();

        const dropdownToggle = document.getElementById('projects-dropdown-toggle');
        const dropdownMenu = document.getElementById('projects-dropdown-menu');
        const dropdownContainer = document.getElementById('projects-dropdown-container');

        if (dropdownToggle && dropdownMenu) {
            dropdownToggle.addEventListener('click', (event) => {
                event.stopPropagation();
                dropdownMenu.classList.toggle('hidden');
                dropdownToggle.classList.toggle('open');
            });

            window.addEventListener('click', (event) => {
                if (!dropdownContainer.contains(event.target)) {
                    dropdownMenu.classList.add('hidden');
                    dropdownToggle.classList.remove('open');
                }
            });
        }
    </script>

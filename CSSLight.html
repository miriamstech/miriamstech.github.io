<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Light</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.9s ease;
        }
        .font-mono {
            font-family: 'Ubuntu Mono', monospace;
        }
    </style>
</head>
<body id="main-body" class="bg-gray-100">

    <main class="w-screen h-screen flex flex-col justify-center items-center p-4">

        <div id="info-text" class="text-center text-gray-500 transition-opacity duration-500">
             <h1 class="text-4xl md:text-6xl font-bold text-gray-800">CSS Light</h1>
             <p class="mt-4 text-lg">add a hex colour code below and the background will change colour! :)</p>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 w-full p-6 flex justify-center">
        <input 
            type="text" 
            id="hexInput" 
            class="font-mono text-lg md:text-xl w-48 text-center bg-white/50 backdrop-blur-sm shadow-lg rounded-full py-3 px-6 border-2 border-transparent focus:border-blue-500 focus:outline-none transition-all duration-300"
            placeholder="#F4TT13" 
            maxlength="7"
        >
    </div>

    <div id="copy-notification" class="fixed top-5 bg-green-500 text-white py-2 px-5 rounded-full shadow-lg transition-all duration-300 opacity-0 -translate-y-10">
        Copied to clipboard!
    </div>

    <script>
        const body = document.getElementById('main-body');
        const hexInput = document.getElementById('hexInput');
        const copyNotification = document.getElementById('copy-notification');
        const infoText = document.getElementById('info-text');

        const hexRegex = /^#([0-9a-fA-F]{3}){1,2}$/;

        function updateColor(color) {
            if (hexRegex.test(color)) {
                body.style.backgroundColor = color;
                infoText.style.opacity = '0';
            } else {
                body.style.backgroundColor = '#f3f4f6';
                infoText.style.opacity = '1';
            }
        }

        hexInput.addEventListener('input', () => {
            let value = hexInput.value.trim();
            if (value.length > 0 && !value.startsWith('#')) {
                value = '#' + value;
            }
            updateColor(value);
        });
        
        hexInput.addEventListener('paste', (event) => {
            let paste = (event.clipboardData || window.clipboardData).getData('text');
            if (paste.length > 0 && !paste.startsWith('#')) {
                paste = '#' + paste;
            }
            setTimeout(() => updateColor(hexInput.value), 10);
        });

        body.addEventListener('click', (event) => {
            if (event.target !== hexInput) {
                const currentColor = hexInput.value;
                if (hexRegex.test(currentColor)) {
                    const tempInput = document.createElement('textarea');
                    tempInput.value = currentColor;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);

                    copyNotification.style.opacity = '1';
                    copyNotification.style.transform = 'translateY(0)';

                    setTimeout(() => {
                        copyNotification.style.opacity = '0';
                        copyNotification.style.transform = 'translateY(-2.5rem)'; // -translate-y-10
                    }, 2000);
                }
            }
        });
  </script>
</body>
</html>
